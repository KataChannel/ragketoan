<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huy Vu Business Insights</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <nav class="glass-nav">
        <div class="logo">HUY VU <span>INSIGHTS</span></div>
        <div class="nav-links">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <main class="container">
        <header class="hero-section">
            <h1 class="animate-up">Financial Intelligence <span>2024</span></h1>
            <p class="animate-up delay-1">Real-time trading analytics and inventory management for Công ty TNHH Huy Vũ.</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card glass animate-up delay-2">
                <h3>Total Revenue</h3>
                <div class="value" id="total-revenue">0 ₫</div>
                <div class="trend positive">+12.5% from last month</div>
            </div>
            <div class="stat-card glass animate-up delay-3">
                <h3>Total Cost</h3>
                <div class="value" id="total-cost">0 ₫</div>
                <div class="trend">Stable overhead</div>
            </div>
            <div class="stat-card glass animate-up delay-4">
                <h3>Net Margin</h3>
                <div class="value" id="net-margin">0 ₫</div>
                <div class="trend positive">+5.2% yield</div>
            </div>
        </section>

        <section class="charts-section animate-up delay-5">
            <div class="chart-container glass">
                <div class="chart-header">
                    <h2>Revenue vs Cost (Monthly)</h2>
                    <div class="chart-controls">
                        <select id="year-select">
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                        </select>
                    </div>
                </div>
                <canvas id="mainChart"></canvas>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
